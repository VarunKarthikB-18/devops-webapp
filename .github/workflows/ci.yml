name: CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build
        run: |
          echo "Starting build..."
          test -f index.html
          echo "Build Success!"

      - name: Run Tests
        run: |
          echo "Running tests..."
          test -f index.html
          echo "Tests Passed!"

      - name: Generate Build Log
        run: |
          echo "Build completed successfully."
          echo "Commit: $GITHUB_SHA"
          echo "Timestamp: $(date -u)"
